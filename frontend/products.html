<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog – SupplySync Enterprise</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div class="app-layout">
        <div id="sidebar-container"></div>

        <div class="main-wrapper">
            <div id="topbar-container"></div>

            <main class="content-container">
                <div class="page-header">
                    <div>
                        <h1 class="page-heading">Product Catalog</h1>
                        <p class="page-subheading">Centralized catalog of inventory SKUs, specifications, pricing and active status</p>
                    </div>
                    <div class="page-actions">
                        <button class="btn btn-primary" onclick="openAddProductModal()">
                            <i class="fa-solid fa-plus"></i> Add New Product
                        </button>
                    </div>
                </div>

                <!-- Filters -->
                <div class="filter-bar">
                    <div class="search-box">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="search-input" class="search-input" placeholder="Search product name, SKU, or description..." oninput="loadProducts()">
                    </div>
                    <div class="filter-actions">
                        <select id="category-filter" class="filter-select" onchange="loadProducts()">
                            <option value="">All Categories</option>
                        </select>
                        <select id="status-filter" class="filter-select" onchange="loadProducts()">
                            <option value="">All Statuses</option>
                            <option value="ACTIVE">Active</option>
                            <option value="DISCONTINUED">Discontinued</option>
                            <option value="OUT_OF_STOCK">Out of Stock</option>
                        </select>
                        <button class="btn btn-secondary" onclick="document.getElementById('search-input').value=''; document.getElementById('category-filter').value=''; document.getElementById('status-filter').value=''; loadProducts();">
                            <i class="fa-solid fa-rotate-right"></i> Reset
                        </button>
                    </div>
                </div>

                <!-- Products Table -->
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Product Name</th>
                                <th>SKU</th>
                                <th>Category</th>
                                <th>Unit Price</th>
                                <th>UOM</th>
                                <th>Status</th>
                                <th style="width: 120px;">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="products-tbody">
                            <tr><td colspan="7" style="text-align: center; padding: 3rem;"><i class="fa-solid fa-circle-notch fa-spin"></i> Loading catalog...</td></tr>
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <!-- Add / Edit Product Modal -->
    <div class="modal-overlay" id="product-modal">
        <div class="modal modal-lg">
            <div class="modal-header">
                <h3 class="modal-title" id="product-modal-title">Add New Product</h3>
                <button class="modal-close" onclick="Common.closeModal('product-modal')">&times;</button>
            </div>
            <form id="product-form" onsubmit="handleProductFormSubmit(event)">
                <div class="modal-body">
                    <input type="hidden" id="product-id">

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label required" for="product-name">Product Name</label>
                            <input type="text" id="product-name" class="form-control" placeholder="e.g. Industrial Steel Rods 2m" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label required" for="product-sku">SKU Code</label>
                            <input type="text" id="product-sku" class="form-control" placeholder="e.g. STL-ROD-01" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label required" for="product-category">Category</label>
                            <select id="product-category" class="form-control" required>
                                <option value="">Select Category...</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label required" for="product-price">Unit Price ($)</label>
                            <input type="number" step="0.01" min="0.01" id="product-price" class="form-control" placeholder="0.00" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label required" for="product-uom">Unit of Measurement (UOM)</label>
                            <input type="text" id="product-uom" class="form-control" placeholder="e.g. Units, Boxes, Kg, Liters, Spools" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="product-status">Listing Status</label>
                            <select id="product-status" class="form-control">
                                <option value="ACTIVE">Active</option>
                                <option value="DISCONTINUED">Discontinued</option>
                                <option value="OUT_OF_STOCK">Out of Stock</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="product-description">Description & Technical Specifications</label>
                        <textarea id="product-description" class="form-control" rows="3" placeholder="Dimensions, material grade, manufacturer specs..."></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="Common.closeModal('product-modal')">Cancel</button>
                    <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Save Product</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/common.js"></script>
    <script src="js/products.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (Auth.requireAuth()) {
                Common.initLayout('products', 'Product Catalog', 'Supply Chain');
                initProductsPage();
            }
        });
    </script>
</body>
</html>
