<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SupplySync Enterprise – Supply Chain & Vendor Management</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body style="background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; color: #ffffff;">
    <div style="text-align: center; max-width: 600px; padding: 2.5rem;">
        <div style="width: 72px; height: 72px; background: #2563eb; border-radius: 16px; margin: 0 auto 1.5rem; display: flex; align-items: center; justify-content: center; font-size: 2rem; box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.5);">
            <i class="fa-solid fa-cubes-stacked"></i>
        </div>
        <h1 style="font-size: 2.5rem; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 0.5rem;">SupplySync</h1>
        <p style="font-size: 1.1rem; color: #94a3b8; margin-bottom: 2rem;">Enterprise Supply Chain, Inventory & Vendor Management System</p>
        
        <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
            <a href="login.html" class="btn btn-primary btn-lg" style="min-width: 180px;">
                <i class="fa-solid fa-arrow-right-to-bracket"></i> Go to Login
            </a>
            <a href="dashboard.html" class="btn btn-secondary btn-lg" style="min-width: 180px;">
                <i class="fa-solid fa-chart-pie"></i> Open Dashboard
            </a>
        </div>
        
        <div style="margin-top: 3rem; font-size: 0.8rem; color: #64748b;">
            College Full-Stack Web Development Project &bull; Java Spring Boot 3 &bull; MySQL 8 &bull; Vanilla JS
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Automatic redirection logic
        if (Auth.isAuthenticated()) {
            window.location.href = 'dashboard.html';
        } else {
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
