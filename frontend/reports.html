<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports & Business Analytics – SupplySync Enterprise</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
    <style>
        .report-tabs-bar {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--slate-200);
            padding-bottom: 0.5rem;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: none;
            border: 1px solid transparent;
            padding: 0.6rem 1.15rem;
            font-size: var(--font-size-sm);
            font-weight: 600;
            color: var(--slate-600);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .tab-btn:hover {
            color: var(--navy-900);
            background-color: var(--slate-200);
        }

        .tab-btn.active {
            color: var(--primary);
            background-color: var(--primary-light);
            border-color: var(--primary-border);
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <div id="sidebar-container"></div>

        <div class="main-wrapper">
            <div id="topbar-container"></div>

            <main class="content-container">
                <div class="page-header no-print">
                    <div>
                        <h1 class="page-heading">Reports & Business Analytics</h1>
                        <p class="page-subheading">Generate verified management audits, procurement expenditure analysis, and warehouse reports</p>
                    </div>
                    <div class="page-actions">
                        <button class="btn btn-secondary" onclick="window.print()">
                            <i class="fa-solid fa-print"></i> Print Report
                        </button>
                        <button class="btn btn-primary" id="btn-export-csv" onclick="exportCurrentReportCsv()">
                            <i class="fa-solid fa-file-csv"></i> Export CSV
                        </button>
                    </div>
                </div>

                <!-- Report Tabs -->
                <div class="report-tabs-bar no-print">
                    <button class="tab-btn active" data-tab="inventory" onclick="switchReportTab('inventory')">
                        <i class="fa-solid fa-warehouse"></i> Inventory Report
                    </button>
                    <button class="tab-btn" data-tab="vendors" onclick="switchReportTab('vendors')">
                        <i class="fa-solid fa-building"></i> Vendor Performance
                    </button>
                    <button class="tab-btn" data-tab="orders" onclick="switchReportTab('orders')">
                        <i class="fa-solid fa-cart-shopping"></i> Purchase Orders
                    </button>
                    <button class="tab-btn" data-tab="low-stock" onclick="switchReportTab('low-stock')">
                        <i class="fa-solid fa-triangle-exclamation"></i> Low Stock Report
                    </button>
                </div>

                <!-- Summary Metrics Ribbon -->
                <div class="stats-grid" style="grid-template-columns: repeat(3, 1fr); margin-bottom: 1.5rem;">
                    <div class="stat-card">
                        <div class="stat-details">
                            <span class="stat-label" id="report-stat-1-label">Metric 1</span>
                            <span class="stat-value" id="report-stat-1-val">-</span>
                        </div>
                        <div class="stat-icon primary"><i class="fa-solid fa-chart-simple"></i></div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-details">
                            <span class="stat-label" id="report-stat-2-label">Metric 2</span>
                            <span class="stat-value" id="report-stat-2-val">-</span>
                        </div>
                        <div class="stat-icon success"><i class="fa-solid fa-scale-balanced"></i></div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-details">
                            <span class="stat-label" id="report-stat-3-label">Metric 3</span>
                            <span class="stat-value" id="report-stat-3-val">-</span>
                        </div>
                        <div class="stat-icon info"><i class="fa-solid fa-clock"></i></div>
                    </div>
                </div>

                <!-- Chart Card -->
                <div class="card" style="margin-bottom: 1.5rem;">
                    <div class="card-header">
                        <h2 class="card-title">Graphical Distribution</h2>
                    </div>
                    <div class="chart-container" style="height: 280px;">
                        <canvas id="reportChart"></canvas>
                    </div>
                </div>

                <!-- Detailed Table -->
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">Detailed Records</h2>
                    </div>
                    <div class="table-container" style="box-shadow: none; border: none;">
                        <table class="data-table">
                            <thead id="report-table-thead"></thead>
                            <tbody id="report-table-tbody">
                                <tr><td colspan="7" class="table-empty"><i class="fa-solid fa-circle-notch fa-spin"></i> Generating report...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/common.js"></script>
    <script src="js/reports.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (Auth.requireAuth()) {
                Common.initLayout('reports', 'Reports & Analytics', 'Intelligence');
                initReportsPage();
            }
        });
    </script>
</body>
</html>
