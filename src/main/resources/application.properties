# SupplySync Enterprise Configuration
spring.application.name=SupplySync

# Server Port
server.port=8080

# Database Configuration (MySQL 8.x)
spring.datasource.url=jdbc:mysql://localhost:3306/supplysync?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Aman2005@
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Static Resource Handling (serve both classpath:/static/ and frontend/)
spring.web.resources.static-locations=classpath:/static/,file:frontend/

# JWT Configuration
app.jwt.secret=SupplySyncEnterpriseSecureJwtSecretKeyMustBeAtLeast256BitsLongForHMACSHA256Algorithm2026
app.jwt.expiration-ms=86400000

# Logging
logging.level.com.supplysync=INFO
logging.level.org.springframework.security=WARN
